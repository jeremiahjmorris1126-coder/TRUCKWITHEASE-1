# ==============================================================================
# Cloudflare Worker & Pages Configuration: TruckWithEase & MorrisHive
# Target Hostnames: truckwithease.com, morrishive.com
# ==============================================================================

name = "truckwithease-1"
main = "server/worker.ts"
compatibility_date = "2024-09-23"

# 1. Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "truckwithease-db"
database_id = "truckwithease-db"

# 2. Cloudflare KV Namespace Cache Binding
[[kv_namespaces]]
binding = "CACHE"
id = "truckwithease-cache"

# 3. Environment Variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "TruckWithEase"
PRIMARY_DOMAIN = "truckwithease.com"
ENTERPRISE_PORTAL_DOMAIN = "morrishive.com"

# 4. Worker API Routes (Direct all /api/* calls to this worker)
routes = [
  { pattern = "truckwithease.com/api/*", zone_name = "truckwithease.com" },
  { pattern = "www.truckwithease.com/api/*", zone_name = "truckwithease.com" },
  { pattern = "morrishive.com/api/*", zone_name = "morrishive.com" },
  { pattern = "www.morrishive.com/api/*", zone_name = "morrishive.com" }
]
