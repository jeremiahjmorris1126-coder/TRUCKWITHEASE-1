# Local Prototyping Seed Data (Excluded from production deployments & client SDKs)
# Note: Do not declare @auth directives in seed_data.gql

mutation SeedTruckWithEaseData @transaction {
  # 1. Seed parent Fleet records
  fleet_upsertMany(
    data: [
      {
        id: "FLEET1"
        carrierName: "Morris Hive Logistics LLC"
        usdotNumber: "3849201"
        mcNumber: "MC-109482"
      }
    ]
  )

  # 2. Seed User records referencing Fleet
  user_upsertMany(
    data: [
      {
        uid: "usr-fleet1-admin"
        email: "admin@fleet1.com"
        displayName: "Fleet 1 Dispatch Admin"
        role: "fleet_admin"
        fleetId: "FLEET1"
      },
      {
        uid: "usr-fleet1-driver"
        email: "driver1@fleet1.com"
        displayName: "Jeremiah Morris"
        role: "driver"
        fleetId: "FLEET1"
      }
    ]
  )

  # 3. Seed Vehicle records referencing Fleet & User
  vehicle_upsertMany(
    data: [
      {
        id: "11111111-1111-4111-8111-111111111111"
        fleetId: "FLEET1"
        assignedDriverUid: "usr-fleet1-driver"
        unitNumber: "TWE-101"
        vin: "1FUJHHDR8NLNA1001"
        make: "Freightliner"
        model: "Cascadia 126"
        year: 2025
        heightFeet: 13.5
        weightLbs: 80000
      }
    ]
  )

  # 4. Seed FreightLoad records referencing Fleet & User
  freightLoad_upsertMany(
    data: [
      {
        id: "22222222-2222-4222-8222-222222222222"
        fleetId: "FLEET1"
        assignedDriverUid: "usr-fleet1-driver"
        origin: "Dallas, TX"
        destination: "Atlanta, GA"
        rateUsd: 2850.0
        miles: 781.0
        weightLbs: 42000
        equipmentType: "DRY_VAN"
        status: "DISPATCHED"
      }
    ]
  )
}
